plugins:
  enabled: true
  configs:
    antigravity-prompt-bridge:
      enabled: true
      priority: 1
      mode: rewrite
      enable_agy: true
      enable_antigravity: true
      antigravity_bridge_system_prompt: true
      agent_alias: true
      heuristic_identity: true
      brand_guard: reject
      unidentified: reject
      use_default_keywords: true
      custom_mappings: {}
      audit: false
