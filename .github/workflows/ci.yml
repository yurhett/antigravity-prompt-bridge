name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, build and verify Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
      - name: Check metadata and version
        shell: bash
        run: |
          python3 scripts/check_version.py
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/check_version.py "$GITHUB_REF_NAME"
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Linux amd64, glibc 2.34
        run: sh scripts/build.sh
      - name: Verify compiled ABI and both bridge states
        run: |
          python3 scripts/abi_smoke.py build/antigravity-prompt-bridge.so
          python3 scripts/native_bridge_abi.py build/antigravity-prompt-bridge.so --output build/abi-report.json
          python3 scripts/agent_alias_abi.py build/antigravity-prompt-bridge.so
          python3 scripts/agent_protocol_abi.py build/antigravity-prompt-bridge.so
          python3 scripts/opencode_adapter_abi.py build/antigravity-prompt-bridge.so
          TRACE_TEST_BRIDGE=build/antigravity-prompt-bridge.so python3 -m unittest discover -s scripts/agent_traces
      - name: Package and verify CPA installation assets
        run: |
          python3 scripts/package_release.py
          python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          make_latest: true

  trace_for_release:
    name: Capture Agent traces for the release tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/agent-traces.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish_trace_baseline:
    name: Attach the immutable Agent trace baseline
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, trace_for_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agent-traces-all
          path: trace-bundle
      - name: Publish tagged traces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/agent_traces/workflow_support.py publish trace-bundle "$GITHUB_REF_NAME" \
            "$(git rev-parse HEAD)" "$RUNNER_TEMP/agent-traces-baseline.zip"
